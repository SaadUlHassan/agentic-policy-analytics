# Source manifest and dataset catalogue (plan §4.2). Read by app.connectors.catalog.
#
# Facts were verified against live responses and the captured snapshots in data/snapshots/ on
# 2026-10-24/25. Anything not yet verified is marked `unverified` and must be confirmed before
# it is relied on.
#
# Marker codes: `unknown` (meaning not confirmed from the source - value is null and flagged),
# `nil_or_negligible` (source-defined; value is null, excluded from calculations, disclosed).
version: 1

platforms:
  singstat:
    name: SingStat Table Builder
    publisher: Department of Statistics Singapore (DOS)
    api: https://tablebuilder.singstat.gov.sg/api/table/tabledata/{table_id}?limit={n}&offset={k}
    search_api: https://tablebuilder.singstat.gov.sg/api/table/resourceid?keyword={kw}&searchOption=all
    human_url: https://tablebuilder.singstat.gov.sg/table/TS/{table_id}
    auth: none
    pagination: >-
      limit/offset count DATA POINTS, not rows. The server caps each response at 5000 points
      even when a larger limit is requested (the response echoes the requested limit). A series
      can be split across pages; merge fragments by seriesNo. Stop when a page returns < 5000 points.
    identity_note: Every response carries `dateGenerated`, so raw bytes change daily for unchanged data.
    values: strings; hierarchy encoded in seriesNo (e.g. 1.2.4 parent, 1.2.4.2 child)
    markers:
      "-": {code: unknown, meaning: unverified}
    licence: unverified
  datagov:
    name: Data.gov.sg
    publisher: GovTech Singapore
    publisher_note: Platform operator; each dataset is managed by its originating agency.
    datastore_api: https://data.gov.sg/api/action/datastore_search?resource_id={id}&limit={n}&offset={k}
    metadata_api: https://api-production.data.gov.sg/v2/public/api/datasets/{id}/metadata
    download_api: >-
      https://api-open.data.gov.sg/v1/public/api/datasets/{id}/initiate-download then /poll-download;
      poll returns a pre-signed S3 URL (temporary credentials - never persist it)
    human_url: https://data.gov.sg/datasets/{id}/view
    auth: optional API key (higher limits)
    rate_limits_no_key: {datastore_per_10s: 4, downloads_per_10s: 2, realtime_per_10s: 6}
    rate_limit_behaviour: >-
      Observed: an over-limit datastore call returned a body without "result" (treat as throttled
      and back off). Documented: HTTP 429. Limits must be shared across workers.
    pagination: datastore offset/limit until offset >= result.total (1000 per page used)
    markers:
      "-": {code: unknown, meaning: unverified}
      "na": {code: unknown, meaning: unverified}
    licence: unverified
  mom:
    name: MOM Statistics (Manpower Research & Statistics Department)
    publisher: Ministry of Manpower
    index_page: https://stats.mom.gov.sg/Pages/EmploymentTimeSeries.aspx
    auth: none
    discovery: >-
      File names embed the release date (DDMMYYYY), e.g. mrsd_4_annl_emp_chg_by_ind_20032026.xlsx.
      Discover by stable prefix on the index page and pick the newest; fall back to last-known URL,
      then snapshot.
    markers:
      "-": {code: nil_or_negligible, meaning: "Nil or negligible",
            evidence: "legend in SSIC2020 sheet of mrsd_3/mrsd_4 workbooks"}
    licence: unverified

# Structured fields used by the connectors and analytics:
#   metric               what one value measures; claims must name the same metric
#   measure_type         stock | flow | rate
#   reference_convention when within the period a value is observed
#   population           who is counted
#   unit / scale         unit of a value and its source multiplier (Thousand -> 1000)
#   classification       industry scheme by period (inclusive bounds, YYYY or YYYY-Qn)
datasets:
  - id: M182841
    platform: singstat
    origin_agency: MOM
    title: Employment (Persons) By Sector, (As At Year-End), Annual
    description: >-
      Number of persons in employment by industry sector at year-end. Administrative records
      with the self-employed component estimated from the Labour Force Survey.
    keywords: [employment, employed, jobs, workforce, headcount, sector, industry, year-end, annual]
    format: json_api
    metric: employment_level
    measure_type: stock
    reference_convention: year_end
    population: total_employment
    frequency: annual
    unit: persons
    scale: 1000
    classification:
      - {scheme: SSIC2020, from: "2008"}
      - {scheme: SSIC2005, from: "2001", to: "2007"}
    coverage: "2001-2025"
    footnotes: >-
      Primarily administrative records, self-employed component estimated from the Labour Force
      Survey. Data may not add up due to rounding.
    mirrors: [d_d2518fed6cc2014f0cd061b4570a9592]

  - id: M183891
    platform: singstat
    origin_agency: MOM
    title: Changes In Employment By Sector, (Compared To The Previous Period), Quarterly
    description: >-
      Quarterly change in the number of persons in employment by industry: difference between
      employment levels at the end of the quarter and the end of the preceding quarter.
    keywords: [employment change, employment growth, net hiring, jobs added, sector, industry, quarterly]
    format: json_api
    metric: employment_change
    measure_type: flow
    reference_convention: quarter_end_difference
    population: total_employment
    frequency: quarterly
    unit: persons
    scale: 1
    classification:
      - {scheme: SSIC2020, from: "2009-Q1"}
      - {scheme: SSIC2005, from: "2002-Q1", to: "2008-Q4"}
    coverage: "2017-Q1 onwards for Information & Communications"
    note: "MOM's mrsd_3 file reports the same statistic in THOUSANDS; SingStat reports persons."

  - id: M184071
    platform: singstat
    origin_agency: MOM
    title: Job Vacancies By Industry And Occupational Group (SSIC 2020) (End Of Period), Quarterly
    description: >-
      Number of job vacancies at the end of each quarter by industry, from the Labour Market
      Survey of establishments. Indicates unmet labour demand.
    keywords: [job vacancies, vacancies, openings, labour demand, hiring demand, industry, quarterly]
    format: json_api
    metric: job_vacancies
    measure_type: stock
    reference_convention: quarter_end
    population: establishments
    frequency: quarterly
    unit: vacancies
    scale: 1
    rounding: nearest 100
    classification:
      - {scheme: SSIC2020, from: "2006-Q1"}
      - {scheme: SSIC2005, from: "2000-Q1", to: "2005-Q4"}
      - {scheme: SSIC1996, from: "1990-Q1", to: "1999-Q4"}
    footnotes: >-
      Before 2006, private sector establishments with at least 25 employees; public sector
      included from 2006. Annual figures are simple averages of the four quarterly figures.
      June 2022 figures revised.
    mirrors: [d_3f17bbf67d31d4d402caa8755eb74afc]

  - id: M184021
    platform: singstat
    origin_agency: MOM
    title: Average Monthly Recruitment Rate By Industry And Occupational Group, (SSIC 2020), Quarterly
    description: Average monthly recruitment rate by industry within each quarter.
    keywords: [recruitment rate, hiring rate, recruitment, industry, quarterly]
    format: json_api
    metric: recruitment_rate
    measure_type: rate
    reference_convention: monthly_average_within_quarter
    population: establishments
    frequency: quarterly
    unit: percent
    scale: 1
    classification:
      - {scheme: SSIC2020, from: "2006-Q1"}

  - id: d_01966fdb498fa7fa2863635e25539693
    platform: datagov
    origin_agency: MOM
    title: Number of Job Vacancy by Industry - Annual
    description: >-
      Annual job vacancies by industry. Each annual value is the mean of the four quarter-end
      values, rounded to the nearest 100.
    keywords: [job vacancies, vacancies, openings, labour demand, industry, annual]
    format: json_api
    metric: job_vacancies
    measure_type: stock
    reference_convention: average_of_quarter_ends
    population: establishments
    frequency: annual
    unit: vacancies
    scale: 1
    rounding: nearest 100
    classification:
      - {scheme: SSIC2020, from: "2006"}
    fields: {period: year, label: industry, value: job_vacancy}
    note: >-
      Annual value = mean of the four quarterly values, rounded to 100 (verified: ICT 2022
      quarterly mean 10,325 -> published 10,300). Industry labels change across SSIC versions.

  - id: d_3f17bbf67d31d4d402caa8755eb74afc
    platform: datagov
    origin_agency: MOM
    title: Number of Job Vacancy by Industry - Quarterly
    description: Number of job vacancies at the end of each quarter by industry.
    keywords: [job vacancies, vacancies, openings, labour demand, industry, quarterly]
    format: [json_api, csv_download]
    metric: job_vacancies
    measure_type: stock
    reference_convention: quarter_end
    population: establishments
    frequency: quarterly
    unit: vacancies
    scale: 1
    rounding: nearest 100
    classification:
      - {scheme: SSIC2020, from: "2006-Q1"}
    fields: {period: quarter, label: industry, value: job_vacancy}
    mirror_of: M184071
    consistency_check: "ICT 2020-Q1..2024-Q4 identical to M184071 series 1.2.4 (verified on snapshot)"

  - id: d_d2518fed6cc2014f0cd061b4570a9592
    platform: datagov
    origin_agency: MOM
    title: Employment (Persons) By Sector, (As At Year-End), Annual
    description: Data.gov.sg republication of SingStat table M182841 (year-end employment by sector).
    keywords: [employment, employed, jobs, sector, industry, year-end, annual]
    format: json_api
    metric: employment_level
    measure_type: stock
    reference_convention: year_end
    population: total_employment
    frequency: annual
    unit: persons
    scale: 1000
    classification:
      - {scheme: SSIC2020, from: "2008"}
      - {scheme: SSIC2005, from: "2001", to: "2007"}
    fields: {layout: wide, label: DataSeries}
    mirror_of: M182841
    resolved_issue: >-
      Its 'na' cells for 2001-2003 are the Real Estate, Professional and Administrative & Support rows,
      which SingStat M182841 does not publish for those years: "not available" where SingStat omits the
      period, not a conflicting value.

  - id: mrsd_4_annl_emp_chg_by_ind
    platform: mom
    origin_agency: MOM
    title: Annual Employment Change by Industry
    format: [xlsx, csv]
    catalogued: false
    frequency: annual
    measure_type: flow
    unit: persons
    scale: 1000
    workbook_sheets: [Contents, "SSIC1996 & SSIC2000", SSIC2005, SSIC2020]
    csv_fields: [year, industry1, industry2, industry3, employment_change]

  - id: mrsd_3_qtly_emp_chg_by_ind
    platform: mom
    origin_agency: MOM
    title: Quarterly Employment Change by Industry
    format: [xlsx, csv]
    catalogued: false
    frequency: quarterly
    measure_type: flow
    unit: persons
    scale: 1000
    workbook_sheets: [Contents, "SSIC1996 & SSIC2000", SSIC2005, SSIC2020]
    csv_fields: [quarter, industry1, industry2, industry3, employment_change]
    quirks: "CSV carries 6 trailing empty columns (Unnamed: 5..10)."

demo_correlation_pair:
  question: >-
    In quarters when more ICT vacancies were open at quarter end, was ICT employment growth over
    the same quarter (lag 0) and the next quarter (lag 1) stronger? (exploratory association)
  x: {dataset: M184071, series_no: "1.2.4", measure_type: stock, reference_convention: quarter_end}
  y: {dataset: M183891, series_no: "1.2.4", measure_type: flow, reference_convention: quarter_end_difference}
  pairing_rule: stock_at_quarter_end__x__flow_over_quarter
  window: 2020-Q1..2024-Q4
  aligned_n: {lag0: 20, lag1: 19}
  caveats:
    - different populations (establishment survey vs administrative total employment)
    - vacancies rounded to nearest 100
    - observations are serially dependent; descriptive only, no p-values
  label_synonym: "'Information & Communications' == 'Information And Communications' (& <-> and)"
