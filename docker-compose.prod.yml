# Production deployment: the published images, production settings, fault injection off.
#
#   POSTGRES_PASSWORD=... docker compose -f docker-compose.prod.yml up -d --wait
#
# Images default to the ones CI publishes from main; set BACKEND_IMAGE / WEB_IMAGE to pin a version
# (e.g. :sha-<commit>). LLM and data credentials come from .env, as in development. The data
# directory (catalogue, taxonomy, snapshots) is mounted from this checkout.
#
# The app has no authentication: every published port stays on loopback. Put an authenticating
# reverse proxy in front before exposing it beyond the host.
name: policy-analytics-prod

x-backend: &backend
  image: ${BACKEND_IMAGE:-ghcr.io/saadulhassan/agentic-policy-analytics-backend:latest}
  env_file:
    - path: .env
      required: false
  environment:
    APP_ENV: prod
    # Demo fault switches do not exist in production; the settings refuse them when APP_ENV=prod.
    ENABLE_FAULT_INJECTION: "false"
    # The password is passed on its own and encoded by the settings, so it may contain any character.
    DATABASE_URL: postgresql+asyncpg://policy@postgres:5432/policy
    DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    REDIS_URL: redis://redis:6379/0
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    DATA_DIR: /app/data
    DATA_MODE: ${DATA_MODE:-live}
    LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-bedrock,openai}
  volumes:
    - ./data:/app/data:ro
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: policy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: policy
    # Not published: only the api, worker and migrate services reach it.
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy -d policy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # Queue, wake-up hints and rate-limit slots only: all rebuildable from Postgres.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *backend
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    <<: *backend
    command: ["arq", "app.worker.settings.WorkerSettings"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  web:
    # The API address is built into the web image (NEXT_PUBLIC_API_URL, default
    # http://localhost:8000); rebuild it for another address.
    image: ${WEB_IMAGE:-ghcr.io/saadulhassan/agentic-policy-analytics-web:latest}
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
