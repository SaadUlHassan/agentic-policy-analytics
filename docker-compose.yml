name: policy-analytics

x-backend: &backend
  build: ./backend
  image: policy-analytics-backend:local
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://policy:policy@postgres:5432/policy
    REDIS_URL: redis://redis:6379/0
    CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
    DATA_DIR: /app/data
    LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-bedrock,openai}
    # Demo fault switches (PUT/DELETE /api/admin/faults/{name}); refused when APP_ENV=prod.
    ENABLE_FAULT_INJECTION: ${ENABLE_FAULT_INJECTION:-false}
  volumes:
    - ./data:/app/data:ro

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: policy
      POSTGRES_PASSWORD: policy
      POSTGRES_DB: policy
    # Published for host-side tools (integration tests, alembic); loopback only.
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy -d policy"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *backend
    # The app has no authentication: keep every published port on loopback for the local demo.
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    <<: *backend
    command: ["arq", "app.worker.settings.WorkerSettings"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    image: policy-analytics-web:local
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
