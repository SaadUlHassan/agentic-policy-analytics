name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: policy
          POSTGRES_PASSWORD: policy
          POSTGRES_DB: policy
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U policy" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Integration tests fail instead of skipping when these services are unreachable.
      REQUIRE_INTEGRATION: "1"
      DATA_MODE: snapshot
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.6"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . ../scripts ../eval && uv run ruff format --check . ../scripts ../eval
      - name: Type check
        run: uv run mypy app
      - name: "Unit and integration tests (offline: snapshots + scripted LLM; live tests excluded)"
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing:skip-covered
      - name: "Core packages coverage >= 80% (agents, analytics, connectors, data, grounding, jobs, events)"
        run: >-
          uv run coverage report --fail-under=80 --skip-covered
          --include='app/agents/*,app/analytics/*,app/connectors/*,app/data/*,app/grounding/*,app/jobs/*,app/events/*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
      - name: "Evaluation gates (golden computations, refusals, adversarial verifier suite)"
        run: uv run python -m app.evaluation --out ../eval/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: eval/results/deterministic.*

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests with coverage (reported, not gated)
        run: npm run coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists the PR's commits to scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      # Used by the production stack only (the development compose ignores them). The password has
      # URL-special characters on purpose: the stack must work with any password.
      POSTGRES_PASSWORD: "ci-only:p@ss/w%rd#?&x"
      BACKEND_IMAGE: policy-analytics-backend:local
      WEB_IMAGE: policy-analytics-web:local
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: API health (database + redis)
        run: curl -fsS http://localhost:8000/api/health
      - name: Web serves the app
        run: curl -fsS http://localhost:3000/ | grep -q "Agentic Policy Analytics"
      - name: Job round-trip through the worker
        run: docker compose exec -T api python -m app.worker.smoke
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
      # The production configuration on the images just built: production settings, no fault switches.
      - name: Start the production stack
        run: docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 300
      - name: Production settings, fault injection off
        run: |
          curl -fsS http://localhost:8000/api/health
          docker compose -f docker-compose.prod.yml exec -T api python -c \
            "from app.core.config import get_settings as g; s = g(); assert s.app_env == 'prod' and not s.enable_fault_injection"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://localhost:8000/api/admin/faults/llm:bedrock)" = 404
          curl -fsS http://localhost:3000/ | grep -q "Agentic Policy Analytics"
          docker compose -f docker-compose.prod.yml exec -T api python -m app.worker.smoke
      - name: Production logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color
      - name: Tear down the production stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  publish:
    # Images go to GHCR only from main and version tags, after every check has passed.
    if: github.event_name == 'push'
    needs: [backend, frontend, secret-scan, compose-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push the backend and web images
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          registry="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          # A Docker tag is [A-Za-z0-9_][A-Za-z0-9_.-]{0,127}: other characters become "-".
          version="$(echo "$GITHUB_REF_NAME" | sed -e 's/[^A-Za-z0-9_.-]/-/g' -e 's/^[.-]*//' | cut -c1-128)"
          version="${version:-ref}"
          for image in backend frontend; do
            name="agentic-policy-analytics-$([ "$image" = frontend ] && echo web || echo backend)"
            tags="-t $registry/$name:sha-$(echo "$GITHUB_SHA" | cut -c1-7) -t $registry/$name:$version"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then tags="$tags -t $registry/$name:latest"; fi
            # shellcheck disable=SC2086 # $tags is a list of -t options
            docker build $tags \
              --label "org.opencontainers.image.source=$SOURCE" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              "$image"
            docker push --all-tags "$registry/$name"
          done
